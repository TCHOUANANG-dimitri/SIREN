# Modèle Nginx hôte pour SIREN.
# Remplacer siren-api.example.invalid par le domaine choisi avant installation.
# Ne pas activer ce fichier avant la résolution DNS et le déploiement de l'API.
server {
    listen 80;
    listen [::]:80;
    server_name siren-api.example.invalid;

    client_max_body_size 2m;

    location = /health {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        include proxy_params;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}