# SIREN — pile serveur (API, worker, beat, PostgreSQL/PostGIS, Redis, Caddy).
# Configuration : copier .env.docker.example en .env (aucun secret réel dans Git).
#   docker compose up -d --build
# Développement (code monté, ports db/redis publiés en local) :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

# Connexions internes construites à partir des mêmes variables que la base :
# impossible d'avoir un mot de passe différent entre la base et l'API.
x-runtime-env: &runtime-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-siren}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-siren}
  DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-siren}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-siren}
  REDIS_URL: redis://redis:6379/0
  REDIS_ENABLED: "true"
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    image: siren-migration:local
    # Migrations SQL versionnées (server/migrations/NNN_*.sql), suivies dans schema_migrations.
    # Base neuve : déjà initialisée par data/schema.sql → rien à rejouer.
    command: python migrations/apply.py
    env_file: .env
    environment: *runtime-env
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siren_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: siren-api:local
    ports:
      - "${SIREN_API_PORT:-8000}:8000"
    env_file: .env
    environment: *runtime-env
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - osm_data:/app/data/osm
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - siren_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: siren-worker:local
    env_file: .env
    environment: *runtime-env
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      # Le worker répond-il réellement au broker ?
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - siren_net

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: siren-beat:local
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/var/lib/celery/beat.schedule
    env_file: .env
    environment: *runtime-env
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - beat_data:/var/lib/celery
    restart: unless-stopped
    networks:
      - siren_net

  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-siren}
    logging: *default-logging
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Schéma reconstitué (data/SCHEMA.md), exécuté UNIQUEMENT sur un volume vide.
      - ../data/schema.sql:/docker-entrypoint-initdb.d/99-siren-schema.sql:ro
    healthcheck:
      # Par TCP : pendant l'initialisation (scripts initdb), PostgreSQL n'écoute que sur
      # le socket local puis redémarre — un test par socket le déclarerait prêt trop tôt.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - siren_net

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - siren_net

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    logging: *default-logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - siren_net

volumes:
  pg_data:
  osm_data:
  beat_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  siren_net:
    driver: bridge
