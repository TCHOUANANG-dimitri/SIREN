# SIREN — Surcouches de développement (code source monté, reload automatique,
# base et Redis joignables depuis le poste pour les outils locaux).
# Usage :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# En production, utiliser uniquement docker-compose.yml (code embarqué dans l'image,
# base et Redis non publiés hors du réseau interne).
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app

  worker:
    volumes:
      - ./:/app

  beat:
    volumes:
      - ./:/app

  db:
    ports:
      - "127.0.0.1:${SIREN_DB_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${SIREN_REDIS_PORT:-6379}:6379"
